name: Build Fabric Mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Extract ZIP source
        run: |
          set -e
          mkdir -p project_extracted
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in root of repository."
            exit 1
          fi
          echo "Found ZIP file: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d project_extracted

      - name: Locate Gradle Root & Grant Permissions
        run: |
          set -e
          BUILD_FILE=$(find project_extracted -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: Could not find build.gradle inside the zip file."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Found Gradle project in: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          
          # Ensure gradlew exists or generate wrapper if missing
          cd "$PROJECT_DIR"
          if [ ! -f ./gradlew ]; then
            echo "gradlew wrapper missing, generating Gradle wrapper..."
            gradle wrapper
          fi
          chmod +x ./gradlew

      - name: Build Mod with Gradle
        run: |
          set -e
          cd "${{ env.PROJECT_DIR }}"
          ./gradlew build --no-daemon

      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Mod-JAR-Output
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
