
name: Build Vector Fabric Mod

on:
  workflow_dispatch:
  push:
    paths:
      - "Vector-Modules-Source.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Extract Vector source
        run: |
          set -e
          mkdir -p project
          unzip -o Vector-Modules-Source.zip -d project
          echo "Files extracted:"
          find project -maxdepth 4 -type f | head -100

      - name: Find Gradle project
        run: |
          set -e
          BUILD_FILE=$(find project -name build.gradle -o -name build.gradle.kts | head -1)
          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: No Gradle build file found in the ZIP."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Build mod
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon build
          else
            echo "ERROR: Gradle wrapper (gradlew) is missing."
            echo "The project ZIP needs a Gradle wrapper or another setup step."
            exit 1
          fi

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Vector-Minecraft-1.21.1
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
